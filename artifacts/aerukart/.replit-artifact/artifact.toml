kind = "web"
previewPath = "/"
title = "Aerukart — Digital Agency"
version = "1.0.0"
id = "artifacts/aerukart"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22537

[services.development]
run = "pnpm --filter @workspace/aerukart run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aerukart", "run", "build" ]
publicDir = "artifacts/aerukart/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22537"
BASE_PATH = "/"
